# Publica el sitio estático en GitHub Pages en cada push a main (o manualmente).
# No hay paso de compilación: se sube solo lo que forma parte del sitio.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preparar el sitio
        run: |
          mkdir -p _site
          cp -r index.html 404.html robots.txt sitemap.xml .nojekyll assets css js _site/
          [ -f CNAME ] && cp CNAME _site/ || true

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v5
